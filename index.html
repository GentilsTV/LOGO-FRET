<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Fret - Administration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 15px;
            color: #334155;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #1e293b;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .whatsapp-btn {
            display: block;
            text-align: center;
            background-color: #25D366;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }
        #resultat {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .section-historique {
            margin-top: 30px;
            border-top: 2px solid #e2e8f0;
            padding-top: 20px;
        }
        .colis-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .btn-call {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 11px;
            margin-top: 4px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Log Fret</h2>
        <div class="subtitle">Espace Administration & Enregistrement</div>
        
        <form id="colisForm">
            <div class="form-group">
                <label>Nom du Client (Expéditeur)</label>
                <input type="text" id="client" placeholder="Ex: Kouadio Jean" required>
            </div>
            
            <div class="form-group">
                <label>Téléphone de l'Expéditeur</label>
                <input type="tel" id="telExp" placeholder="Ex: +22507000000" required>
            </div>

            <div class="form-group">
                <label>Téléphone du Destinataire</label>
                <input type="tel" id="telDest" placeholder="Ex: +33600000000" required>
            </div>

            <div class="form-group">
                <label>Destination</label>
                <select id="destination">
                    <option value="Abidjan - Paris">Abidjan ➔ Paris</option>
                    <option value="Abidjan - Italie">Abidjan ➔ Italie</option>
                    <option value="Abidjan - Sous-région">Abidjan ➔ Sous-région</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description du Colis</label>
                <textarea id="description" placeholder="Ex: 3 Cartons de vêtements..." required></textarea>
            </div>

            <div class="form-group">
                <label>Poids (Kg)</label>
                <input type="number" step="0.1" id="poids" placeholder="Ex: 12.5" required>
            </div>

            <button type="submit" id="btnSubmit">Enregistrer le Colis</button>
        </form>
        <div id="resultat"></div>

        <!-- Lien WhatsApp Officiel -->
        <a href="https://wa.me/2250170979736" target="_blank" class="whatsapp-btn">💬 Contact WhatsApp Log Fret</a>

        <!-- Section Historique Admin -->
        <div class="section-historique">
            <h3 style="font-size: 16px; color: #1e3a8a; margin-top:0;">Historique récent enregistré</h3>
            <div id="listeHistorique">Aucun colis enregistré pour l'instant.</div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz0-OeasMHF37RshgGZt3ki62URAA2pThY2RyySh9cLWXCGUgKHeaQLl5QYwFcS0QIBPQ/exec';

        document.getElementById('colisForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resDiv = document.getElementById('resultat');
            
            const trackingID = 'LF-' + Math.floor(100000 + Math.random() * 900000);
            const data = {
                client: document.getElementById('client').value,
                telExp: document.getElementById('telExp').value,
                telDest: document.getElementById('telDest').value,
                destination: document.getElementById('destination').value,
                description: document.getElementById('description').value,
                poids: document.getElementById('poids').value,
                tracking: trackingID
            };

            btn.disabled = true;
            btn.innerText = "Enregistrement en cours...";
            resDiv.style.color = "#2563eb";
            resDiv.innerText = "Envoi vers la base de données...";

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                
                resDiv.style.color = "#16a34a";
                resDiv.innerHTML = `Colis enregistré avec succès !<br><b>Suivi : ${trackingID}</b>`;
                
                // Ajouter à l'historique local de l'écran
                ajouterHistoriqueLocal(data);
                document.getElementById('colisForm').reset();
            } catch (error) {
                resDiv.style.color = "#dc2626";
                resDiv.innerText = "Erreur lors de l'enregistrement.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Enregistrer le Colis";
            }
        });

        function ajouterHistoriqueLocal(item) {
            const histDiv = document.getElementById('listeHistorique');
            if (histDiv.innerText.includes("Aucun colis")) {
                histDiv.innerHTML = "";
            }
            
            const card = document.createElement('div');
            card.className = "colis-card";
            card.innerHTML = `
                <b>Suivi :</b> ${item.tracking}<br>
                <b>Client :</b> ${item.client} <br>
                <b>Destinataire :</b> ${item.destination}<br>
                <a href="tel:${item.telExp}" class="btn-call">📞 Appeler Expéditeur</a>
                <a href="tel:${item.telDest}" class="btn-call">📞 Appeler Destinataire</a>
            `;
            histDiv.prepend(card);
        }
    </script>
</body>
</html>
