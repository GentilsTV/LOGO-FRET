<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Fret - Portail Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 15px;
            color: #334155;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { color: #1e3a8a; font-size: 24px; margin-bottom: 5px; text-align: center; }
        .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 20px; }
        
        .auth-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-btn { flex: 1; padding: 10px; border: 2px solid #2563eb; background: white; color: #2563eb; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
        .auth-btn.active { background: #2563eb; color: white; }
        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #1e293b; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #2563eb; }
        textarea { resize: vertical; height: 60px; }
        
        button.action-btn { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .whatsapp-btn { display: block; text-align: center; background-color: #25D366; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; font-size: 14px; }
        .admin-panel { display: none; }
        #resultat, #authMsg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Log Fret</h2>
        <div class="subtitle">Espace Sécurisé Administration & Agents</div>

        <!-- PORTAIL AUTHENTIFICATION -->
        <div id="authContainer">
            <div class="auth-buttons">
                <button class="auth-btn active" onclick="switchTab('login')">Connexion</button>
                <button class="auth-btn" onclick="switchTab('register')">Inscription</button>
            </div>

            <!-- Connexion -->
            <div id="loginSection" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Agent</label>
                        <input type="email" id="loginEmail" placeholder="agent@logfret.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="action-btn" id="btnLogin">Se connecter</button>
                </form>
            </div>

            <!-- Inscription -->
            <div id="registerSection" class="form-section">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Nom complet de l'Agent</label>
                        <input type="text" id="regName" placeholder="Ex: Jean Kouassi" required>
                    </div>
                    <div class="form-group">
                        <label>Email professionnel</label>
                        <input type="email" id="regEmail" placeholder="agent@logfret.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="regPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="action-btn" id="btnReg" style="background: linear-gradient(135deg, #16a34a, #15803d);">Créer mon compte</button>
                </form>
            </div>
            <div id="authMsg"></div>
        </div>

        <!-- TABLEAU DE BORD AGENT -->
        <div id="adminPanel" class="admin-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                <span id="agentConnected" style="font-weight: bold; color: #2563eb; font-size: 14px;"></span>
                <button onclick="logout()" style="background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;">Déconnexion</button>
            </div>

            <h3 style="font-size: 16px; color: #1e3a8a; margin-top:0;">Enregistrer un Nouveau Colis</h3>
            
            <form id="colisForm">
                <div class="form-group">
                    <label>Nom du Client (Expéditeur)</label>
                    <input type="text" id="client" placeholder="Ex: Kouadio Jean" required>
                </div>
                <div class="form-group">
                    <label>Téléphone de l'Expéditeur</label>
                    <input type="tel" id="telExp" placeholder="Ex: +22507000000" required>
                </div>
                <div class="form-group">
                    <label>Téléphone du Destinataire</label>
                    <input type="tel" id="telDest" placeholder="Ex: +33600000000" required>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <select id="destination">
                        <option value="Abidjan - Paris">Abidjan ➔ Paris</option>
                        <option value="Abidjan - Italie">Abidjan ➔ Italie</option>
                        <option value="Abidjan - Sous-région">Abidjan ➔ Sous-région</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description du Colis</label>
                    <textarea id="description" placeholder="Ex: 3 Cartons de vêtements..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Poids (Kg)</label>
                    <input type="number" step="0.1" id="poids" placeholder="Ex: 12.5" required>
                </div>
                <div class="form-group">
                    <label>Prix de l'expédition (FCFA)</label>
                    <input type="number" id="prix" placeholder="Ex: 75000" required>
                </div>
                <div class="form-group">
                    <label>Date & Heure d'Expédition</label>
                    <input type="datetime-local" id="dateExp" required>
                </div>
                <div class="form-group">
                    <label>Date & Heure d'Arrivée (Estimée)</label>
                    <input type="datetime-local" id="dateArrivee" required>
                </div>
                <div class="form-group">
                    <label>Lien de Suivi GPS / Satellite (Optionnel)</label>
                    <input type="url" id="gps" placeholder="Ex: https://maps.google.com/...">
                </div>

                <button type="submit" id="btnSubmit" class="action-btn">Enregistrer le Colis</button>
            </form>
            <div id="resultat"></div>
        </div>

        <a href="https://wa.me/2250170979736" target="_blank" class="whatsapp-btn">💬 Contact WhatsApp Log Fret</a>
    </div>

    <script>
        // Ton nouveau lien Google Apps Script mis à jour
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzIyvxUaF43_bpHaumsI0oYsttmPO_-r0FvYb5vpFWjTlXiGXbW9DUzJHY-LgNNm7Mqhg/exec';

        function switchTab(tab) {
            document.querySelectorAll('.auth-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById('authMsg').innerText = "";
            if (tab === 'login') {
                document.querySelectorAll('.auth-btn')[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.querySelectorAll('.auth-btn')[1].classList.add('active');
                document.getElementById('registerSection').classList.add('active');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            const msg = document.getElementById('authMsg');
            
            const data = {
                action: "register",
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };

            btn.disabled = true;
            msg.style.color = "#2563eb";
            msg.innerText = "Création du compte en cours...";

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                const res = await response.json();

                if (res.result === "success") {
                    msg.style.color = "#16a34a";
                    msg.innerText = "Compte créé avec succès ! Connectez-vous.";
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    msg.style.color = "#dc2626";
                    msg.innerText = res.message || "Erreur lors de l'inscription.";
                }
            } catch (err) {
                msg.style.color = "#dc2626";
                msg.innerText = "Erreur de connexion au serveur.";
            } finally {
                btn.disabled = false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('authMsg');

            const data = {
                action: "login",
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            btn.disabled = true;
            msg.style.color = "#2563eb";
            msg.innerText = "Connexion en cours...";

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                const res = await response.json();

                if (res.result === "success") {
                    localStorage.setItem('logfret_agent', res.name);
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('agentConnected').innerText = `👤 Connecté : ${res.name}`;
                } else {
                    msg.style.color = "#dc2626";
                    msg.innerText = res.message || "Identifiants incorrects.";
                }
            } catch (err) {
                msg.style.color = "#dc2626";
                msg.innerText = "Erreur de connexion au serveur.";
            } finally {
                btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('logfret_agent');
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('authMsg').innerText = "";
        }

        document.getElementById('colisForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resDiv = document.getElementById('resultat');
            const agentName = localStorage.getItem('logfret_agent') || "Agent Principal";
            
            const trackingID = 'LF-' + Math.floor(100000 + Math.random() * 900000);
            const data = {
                client: document.getElementById('client').value,
                telExp: document.getElementById('telExp').value,
                telDest: document.getElementById('telDest').value,
                destination: document.getElementById('destination').value,
                description: document.getElementById('description').value,
                poids: document.getElementById('poids').value,
                prix: document.getElementById('prix').value,
                dateExp: document.getElementById('dateExp').value,
                dateArrivee: document.getElementById('dateArrivee').value,
                agent: agentName,
                gps: document.getElementById('gps').value,
                tracking: trackingID
            };

            btn.disabled = true;
            btn.innerText = "Enregistrement en cours...";
            resDiv.style.color = "#2563eb";
            resDiv.innerText = "Envoi vers Google Sheets...";

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                
                resDiv.style.color = "#16a34a";
                resDiv.innerHTML = `Colis enregistré avec succès !<br><b>Numéro de Suivi : ${trackingID}</b>`;
                document.getElementById('colisForm').reset();
            } catch (error) {
                resDiv.style.color = "#dc2626";
                resDiv.innerText = "Erreur lors de l'enregistrement.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Enregistrer le Colis";
            }
        });
    </script>
</body>
    </html>
